name: Release

# Pushing a tag such as v1.0.0 builds the download ZIP from the tracked files and publishes a GitHub Release with it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the ZIP from the tracked files
        run: git archive --format=zip --prefix=NorthLight-Tower/ -o "NorthLight-Tower-${GITHUB_REF_NAME}.zip" HEAD

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "NorthLight-Tower-${GITHUB_REF_NAME}.zip" \
            --title "NorthLight Tower ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
